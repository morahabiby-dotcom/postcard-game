<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hike and Smile – Year 3 English Game</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8f9ec;--card:#fff;--ink:#1f3b2c;--sub:#4f7a62;--pri:#12a150;--ok:#2ea44f;--okbg:#d9f7e2;--bad:#e5484d;--badbg:#ffe0e0;--line:#c5ead0;--hi:#fff3bf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10261a;--card:#1b3a29;--ink:#effff4;--sub:#a5d4b6;--pri:#3ecf7b;--ok:#5fd48a;--okbg:#1f5a38;--bad:#ff7b80;--badbg:#5a2530;--line:#2f5c43;--hi:#4a4620}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2.1rem;margin:.2em 0;text-align:center}
.sub{text-align:center;color:var(--sub);font-size:1.1rem;margin:0 0 14px}
.mascot{font-size:4rem;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;margin:12px 0}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:20px;padding:12px 14px;margin:10px 0;cursor:pointer}
.lv:active{transform:scale(.98)}
.lv .ic{font-size:2rem}.lv b{display:block;font-size:1.2rem}.lv small{color:var(--sub);font-size:.95rem}.lv .st{margin-left:auto;font-size:1.1rem;white-space:nowrap}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.home{background:none;border:0;font:inherit;font-size:1.6rem;cursor:pointer;color:var(--ink)}
.q{font-size:1.45rem;font-weight:700;text-align:center;margin:6px 0 10px}
.quote{background:var(--hi);border-left:6px solid var(--pri);border-radius:12px;padding:10px 14px;font-size:1.1rem;margin:8px 0;font-style:italic}
.word{font-size:2.6rem;font-weight:800;text-align:center;color:var(--pri);margin:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts.one{grid-template-columns:1fr}
.btn{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 8px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:58px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--okbg);border-color:var(--ok)}.btn.bad{background:var(--badbg);border-color:var(--bad)}
.fb{min-height:64px;text-align:center;font-size:1.15rem;margin-top:10px;font-weight:600}
.big{font-size:3.4rem;text-align:center;letter-spacing:6px}
.center{text-align:center}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.15)}}
.shk{animation:shk .3s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tip{background:var(--hi);border-radius:14px;padding:10px 14px;text-align:center;font-weight:600}
</style></head><body><div class="wrap" id="app"></div>
<script>
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const pick=(a,n)=>sh(a).slice(0,n);
const CHEER=['Brilliant! 🎉','Super! ⭐','You got it! 🌟','Wow, great job! 🎈','Yes! 🦜','Fantastic! 🚀'];
const TRY=['Nearly! Have another look 👀','Good try! Let’s learn from it 💪'];
const uniq=a=>[...new Set(a)];
// ---- level 1 & 2: e-verbs ----
const EV=['hike','smile','dance','bake','wave','race','shine','chase','joke','love','save','late'].filter(x=>x!='late');
function ing(v){return v.slice(0,-1)+'ing'}function ed(v){return v.slice(0,-1)+'ed'}
function wrong(v,suf){const s=v.slice(0,-1);return uniq([v+suf,s+s.slice(-1)+suf,s.slice(0,-1)+suf,s+'e'+suf]).filter(x=>x!==s+suf)}
function spellQs(){return pick(EV,8).map((v,i)=>{const g=i%2==0,suf=g?'ing':'ed',a=v.slice(0,-1)+suf;
 return{p:'Add “'+suf+'” to the verb:',w:v+' + '+suf+' = ?',o:sh([a,...pick(wrong(v,suf),3)]),a,e:'Take away the e, then add '+suf+':  '+v.slice(0,-1)+' + '+suf+' = '+a+' ✅'}})}
const GAP=[['I am ___ up the hill.','hike','ing','Now'],['I am ___ at my teacher.','smile','ing','Now'],['I ___ at the party.','dance','ed','Before'],['I ___ a cake.','bake','ed','Before'],['We are ___ at the toucan.','wave','ing','Now'],['We ___ down the path.','race','ed','Before'],['The sun is ___ today.','shine','ing','Now'],['Mia ___ the butterfly.','chase','ed','Before']];
function gapQs(){return pick(GAP,8).map(g=>{const v=g[1],a=v.slice(0,-1)+g[2],oth=v.slice(0,-1)+(g[2]=='ing'?'ed':'ing');
 return{p:g[3]+': '+g[0].replace('___','_____')+' ('+v+')',o:sh(uniq([a,oth,v+g[2],v.slice(0,-1)+v.slice(-2,-1)+g[2]]).slice(0,4)),a,e:(g[3]=='Now'?'“Now” means ing. ':'“Before” means ed. ')+'Correct: '+a}})}
// ---- level 3: starters ----
const ST=[['In the morning,','When? (time)'],['After lunch,','When? (time)'],['Later in the afternoon,','When? (time)'],['Yesterday,','When? (time)'],['Next,','When? (time)'],['By the waterfall,','Where? (place)'],['In the rainforest,','Where? (place)'],['At the top of the hill,','Where? (place)'],['On the path,','Where? (place)'],['Slowly and carefully,','How? (manner)'],['Quietly,','How? (manner)'],['With a big smile,','How? (manner)'],['Happily,','How? (manner)']];
function stQs(){return pick(ST,8).map(s=>({p:'What does this sentence starter tell us?',w:s[0],o:['When? (time)','Where? (place)','How? (manner)'],a:s[1],e:'“'+s[0].replace(/,$/,'')+'” tells the reader '+s[1].replace('?','').toLowerCase()+'.'}))}
// ---- level 4: past tense ----
const PT=[['see','saw'],['is','was'],['run','ran'],['hope','hoped'],['like','liked'],['scare','scared'],['jump','jumped'],['swim','swam'],['go','went'],['smile','smiled'],['come','came'],['give','gave']];
function ptQs(){return pick(PT,8).map(p=>{const w=pick(PT.filter(x=>x[1]!==p[1]).map(x=>x[1]),2).concat(p[0]+'ed'==p[1]?[p[0]+'d'.repeat(0)+'ing'.replace('ing','ing')]:[p[0]+'ed']);
 return{p:'Yesterday, I ___ . What is the past tense?',w:p[0],o:sh(uniq([p[1],...w]).slice(0,4)),a:p[1],e:p[0]+' → '+p[1]+(p[1].endsWith('ed')?' (e verbs: just add d!)':' (a tricky one – learn it!)')}})}
// ---- level 5: word meanings ----
const WM=[['poorly','ill','tired','happy','loud'],['guide','a person who shows you things on a tour','a type of bird','a map','a bus driver'],['fed up','irritated – had enough of something','very hungry','full of food','sleepy'],['local','close to where you live','far away','very big','new'],['ran riot','ran around and behaved badly','ran very fast','ran away quietly','ran a race']];
function wmQs(){return sh(WM).map(w=>({p:'What does this word mean?',w:w[0],o:sh(w.slice(1)),a:w[1],e:'“'+w[0]+'”: '+w[1]+'.'}))}
// ---- level 6: postcard detective ----
const PC=[
['“We didn’t see as much wildlife as I’d hoped.” (Mia’s postcard)','Mario says Mia and Elena ran riot. Why did they see little wildlife in the morning?',['Mia and Elena were noisy and scared it away','It was night time','There was no rainforest','They stayed in bed'],0,'Mario wrote that they “scared all the wildlife away”. That’s a clue you have to put together!'],
['“There was an older couple on the tour with us and I don’t think they were very pleased.” (Mario)','Do you think the older couple enjoyed the tour?',['Probably not – they were jumped out at','Yes, they loved it','They were not there','They went swimming'],0,'Mia jumped out at them, and Mario says they weren’t pleased.'],
['“I’m really fed up with Mia and Elena… I wish I’d come to Rio on my own.”','Why didn’t Luiz and Mario have fun running around?',['They found it boring and were grumpy','They were ill','They loved it','They were asleep'],0,'Mia says they “looked bored and grumpy”.'],
['“Auntie Alma felt poorly (she’s fine now).”','Why couldn’t Auntie Alma go on the tour?',['She was ill','She was at the beach','She was a guide','She was swimming'],0,'“Poorly” means ill.'],
['“After lunch, he even let us swim in the waterfall.”','What did the guide let them do after lunch?',['Swim in the waterfall','See a toco toucan','Go to the beach','Run up the path'],0,'The words “After lunch” are a time starter!'],
['“Tomorrow, Luiz and I are getting up early and going to the beach without them.”','What will Mario do tomorrow?',['Go to the beach with Luiz','Go on the tour again','Swim in the waterfall','Stay with Mia'],0,'He wrote it in the postcard (explicit information).']];
function pcQs(){return sh(PC).map(c=>{const a=c[2][c[3]];return{p:c[1],t:c[0],o:sh(c[2]),a,e:c[4]}})}
const LV=[
 {i:'✍️',t:'Spell It!',d:'Add ing or ed to e-verbs',q:spellQs,tip:'Remember: take away the e first, then add ing or ed! 🐸 smile → smiling'},
 {i:'🥾',t:'Fill the Gap',d:'Now (ing) or before (ed)?',q:gapQs,tip:'“Now” → ing.  “Before” → ed.  Take off the e first!'},
 {i:'🧭',t:'Sentence Starters',d:'When, where or how?',q:stQs,tip:'Starters tell the reader WHEN, WHERE or HOW things happened.'},
 {i:'⏪',t:'Past Tense Power',d:'See → saw, run → ran…',q:ptQs,tip:'Past tense = it already happened.'},
 {i:'📖',t:'Word Whiz',d:'Words from the postcards',q:wmQs,tip:'Use the words around a new word to help you.'},
 {i:'🕵️',t:'Postcard Detective',d:'Read between the lines',q:pcQs,tip:'Some answers are written (explicit). Some you work out from clues (implicit).'}];
const stars=[0,0,0,0,0,0];
const $=document.getElementById('app');
function home(){const tot=stars.reduce((a,b)=>a+b,0);
 $.innerHTML='<div class="mascot">🦜</div><h1>Hike & Smile!</h1><p class="sub">Hi! I’m Toco the toucan. Pick a game and win stars! ⭐ '+tot+'/18</p>'+
 LV.map((l,i)=>'<button class="lv" onclick="intro('+i+')"><span class="ic">'+l.i+'</span><span><b>'+(i+1)+'. '+l.t+'</b><small>'+l.d+'</small></span><span class="st">'+'⭐'.repeat(stars[i])+'☆'.repeat(3-stars[i])+'</span></button>').join('')}
let L,Q,n,sc,lock;
function intro(i){L=i;$.innerHTML='<div class="mascot">'+LV[i].i+'</div><h1>'+LV[i].t+'</h1><div class="tip">'+LV[i].tip+'</div><div class="opts one"><button class="btn pri" onclick="start()">Let’s go! ➜</button><button class="btn" onclick="home()">🏠 Back</button></div>'}
function start(){sc=0;n=0;Q=LV[L].q();show()}
function hdr(){return '<div class="top"><button class="home" onclick="home()" aria-label="Home">🏠</button><div class="bar"><i style="width:'+(n/Q.length*100)+'%"></i></div><b>⭐'+sc+'</b></div>'}
function show(){if(n>=Q.length)return end(Q.length);lock=0;const q=Q[n];
 $.innerHTML=hdr()+'<div class="card"><div class="q">'+q.p+'</div>'+(q.t?'<div class="quote">'+q.t+'</div>':'')+(q.w?'<div class="word">'+q.w+'</div>':'')+
 '<div class="opts'+(q.o.some(x=>x.length>16)?' one':'')+'">'+q.o.map((o,i)=>'<button class="btn" onclick="ans('+i+')">'+o+'</button>').join('')+'</div><div class="fb" id="fb"></div></div>'}
function ans(i){if(lock)return;lock=1;const q=Q[n],b=document.querySelectorAll('.opts .btn'),right=q.o[i]===q.a;
 b.forEach((x,j)=>{if(q.o[j]===q.a)x.classList.add('ok')});
 if(right){sc++;b[i].classList.add('pop')}else{b[i].classList.add('bad','shk')}
 document.getElementById('fb').innerHTML=(right?CHEER[n%6]:TRY[n%2])+'<br><small>'+q.e+'</small><br><button class="btn pri" style="margin-top:8px;padding:10px 30px" onclick="n++;show()">Next ➜</button>'}
function end(t){const r=sc/t,s=r>=.9?3:r>=.6?2:r>=.3?1:0;stars[L]=Math.max(stars[L],s);
 $.innerHTML='<div class="mascot">'+(s>=2?'🏆':'🦜')+'</div><h1>'+(s==3?'Superstar!':s==2?'Great work!':s==1?'Good try!':'Keep going!')+'</h1><div class="big">'+'⭐'.repeat(s)+'☆'.repeat(3-s)+'</div><p class="sub">You scored '+sc+' out of '+t+'</p><div class="opts"><button class="btn pri" onclick="start()">🔁 Play again</button><button class="btn" onclick="home()">🏠 All games</button></div>'+(s==3?'<p class="center">🎉 Great job! You are a star! 🎉</p>':'')}
home();
</script></body></html>
